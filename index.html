  <style>
  
    :root { color-scheme: dark; --paper: #f3f4f6; --muted: #9ca8bd; --line: rgba(214,226,255,.12); --blue: #8fdcff; --pink: #f093c4; --poster-width: 130px; --poster-art-height: 195px; --poster-card-height: 235px; }

    .cosmos.post::before { background: radial-gradient(ellipse at 18% 28%,rgba(114,52,172,.3),transparent 36%), radial-gradient(ellipse at 78% 72%,rgba(199,50,113,.23),transparent 34%), radial-gradient(ellipse at 51% 45%,rgba(32,12,52,.14),transparent 58%); }

    @media (hover:hover) and (pointer:fine) {

    $$(".page-dot").forEach(dot => dot.addEventListener("click", () => slideTo(Number(dot.dataset.page))));
    $("#search").addEventListener("input", filterTitles);
    $("#dismiss-api-notice").addEventListener("click", () => { $("#api-notice").hidden = true; });
    $("#close-modal").addEventListener("click", closeDetails);
    $("#modal-backdrop").addEventListener("click", event => { if (event.target === $("#modal-backdrop")) closeDetails(); });
    document.addEventListener("keydown", event => {
      if (event.key === "Escape") closeDetails();
      if (event.key === "ArrowRight" && !$("#modal-backdrop").classList.contains("open")) slideTo(1);
      if (event.key === "ArrowLeft" && !$("#modal-backdrop").classList.contains("open")) slideTo(0);
    });
    if (state.key) startPosterHydration();
  </script>
</body>
</html>
